<style>
/* Layout: one warm-paper page, the same look the shop would have. A one-line title, then every screen of the shop as a device pair you drag from hoje to depois. */
:root {
  --paper: #F4F0E9;
  --paper-rgb: 244 240 233;
  --paper-2: #EBE5DB;
  --card: #FBF9F5;
  --ink: #1D1B18;
  --ink-rgb: 29 27 24;
  --muted: #6F695F;
  --line: #E0D9CD;
  --azul: #0B6E8C;
  --white: #FFFFFF;
  --shade: 70 52 28;
  --f: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-inline: clamp(16px, 4vw, 48px); }
img { display: block; }
.wrap { max-width: 1320px; margin-inline: auto; padding-block: 0 56px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.logo { mix-blend-mode: multiply; }

/* Sticky screen index */
.pn { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; isolation: isolate; display: flex; align-items: center; gap: 18px; padding-block: 10px; background: rgb(var(--paper-rgb) / .92); box-shadow: 0 0 0 100vmax rgb(var(--paper-rgb) / .92); clip-path: inset(0 -100vmax); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.pn .logo { width: 44px; height: 44px; flex: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chips a { flex: none; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
.chips a:hover, .chips a:focus-visible { background: var(--ink); border-color: var(--ink); color: var(--paper); outline: none; }

.top { padding-block: clamp(40px, 6vw, 80px) 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
.h1 { font-weight: 600; font-stretch: 88%; font-size: clamp(44px, 7.4vw, 104px); line-height: .92; letter-spacing: -.045em; margin: 0; }
.h1 span { color: var(--muted); }

/* Screens */
.hint { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; padding: 8px 15px; border-radius: 999px; margin: 0; }
.scr { padding-top: clamp(56px, 8vw, 104px); scroll-margin-top: 70px; }
.scr-head { display: flex; align-items: baseline; gap: 10px 20px; flex-wrap: wrap; margin-bottom: clamp(20px, 3vw, 32px); }
.scr-head .n { font-weight: 600; font-size: clamp(16px, 1.6vw, 20px); color: var(--muted); font-variant-numeric: tabular-nums; }
.scr-head h3 { font-weight: 600; font-stretch: 90%; font-size: clamp(36px, 5vw, 64px); line-height: .95; letter-spacing: -.035em; margin: 0; }
.devices { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: clamp(20px, 3vw, 40px); align-items: end; }
.devices.solo { grid-template-columns: minmax(0, 1fr); }

.browser { margin: 0; border-radius: 12px; background: var(--card); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 40px 70px -40px rgb(var(--shade) / .45); }
.bar { height: 34px; display: flex; align-items: center; gap: 7px; padding-inline: 14px; border-bottom: 1px solid var(--line); }
.bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.url { margin-inline: auto; font-size: 12px; color: var(--muted); background: var(--paper); padding: 3px clamp(14px, 5vw, 56px); border-radius: 7px; }
.browser .compare { aspect-ratio: 1440 / 900; }
.phone { width: 300px; max-width: 100%; padding: 9px; border-radius: 46px; background: var(--ink); box-shadow: 0 40px 70px -36px rgb(var(--shade) / .6); justify-self: center; }
.phone .compare { aspect-ratio: 390 / 844; border-radius: 37px; }

.compare { position: relative; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; --pos: 50%; --k: 1; background: var(--paper); }
.compare .layer { position: absolute; inset: 0; }
.compare .before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.compare .before > img { width: 100%; height: 100%; object-fit: cover; }
.canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; transform: scale(var(--k)); }
.handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 0; outline: none; z-index: 3; }
.handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--white); box-shadow: 0 0 0 1px rgb(var(--ink-rgb) / .3); }
.knob { position: absolute; top: 50%; left: 0; width: 44px; height: 44px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--azul); color: var(--white); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--white), 0 8px 20px rgb(var(--shade) / .35); }
.handle:focus-visible .knob { box-shadow: 0 0 0 3px var(--white), 0 0 0 6px var(--ink); }
.tag { position: absolute; top: 15%; padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; transition: opacity .2s; pointer-events: none; z-index: 2; }
.t-before { left: 12px; background: var(--ink); color: var(--white); }
.t-after { right: 12px; background: var(--white); color: var(--ink); box-shadow: 0 2px 8px rgb(var(--shade) / .2); }
.compare.lo .t-before, .compare.hi .t-after { opacity: 0; }

.fine { color: var(--muted); font-size: 13px; margin: clamp(56px, 8vw, 96px) 0 0; }

/* ===================== The shop itself (mock-ups, fixed size, always this look) ===================== */
.s { position: absolute; inset: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.3; overflow: hidden; }
.s h1, .s h2, .s h3, .s p { margin: 0; }
.s .i { width: 22px; height: 22px; }
.s-ann { height: 36px; background: var(--ink); color: #EDE7DD; display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 13px; letter-spacing: .02em; }
.s-ann i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; }
.cp .s-ann { height: 32px; font-size: 12px; }
.s-hd { height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 56px; border-bottom: 1px solid var(--line); background: var(--paper); }
.s-hd nav { display: flex; gap: 32px; font-size: 15px; font-weight: 500; }
.s-hd .logo { width: 68px; height: 68px; }
.s-tools { display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
.s-srch { width: 220px; height: 40px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); font-size: 14px; }
.s-srch .i { width: 18px; height: 18px; color: var(--ink); }
.s-bag { position: relative; display: block; line-height: 0; }
.s-bag b { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 600; display: grid; place-items: center; line-height: 1; }
.s-hp { height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--paper); }
.s-hp .logo { width: 50px; height: 50px; }
.s-hp .s-tools { gap: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 28px; border-radius: 999px; background: var(--azul); color: var(--white); font-weight: 600; font-size: 16px; white-space: nowrap; }
.btn.full { width: 100%; }
.lnk { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; white-space: nowrap; }
.ey { display: block; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.crumb { font-size: 13px; color: var(--muted); }
.big { font-weight: 600; font-stretch: 90%; letter-spacing: -.03em; line-height: 1; }
.row { display: flex; gap: 24px; align-items: center; }
.hd2 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.hd2 h2 { font-size: 26px; font-weight: 600; font-stretch: 90%; letter-spacing: -.02em; }
.cp .hd2 h2 { font-size: 20px; }
.cp .lnk { font-size: 14px; }

.ph { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--paper-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.off { position: absolute; top: 10px; left: 10px; background: var(--card); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; }
.c-n { margin-top: 10px; font-size: 15px; font-weight: 500; }
.c-p { margin-top: 2px; display: flex; gap: 8px; align-items: baseline; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.c-p s { color: var(--muted); font-weight: 400; font-size: 14px; }
.cp .c-n { font-size: 13.5px; margin-top: 8px; }
.cp .c-p { font-size: 13.5px; }
.cp .c-p s { font-size: 12.5px; }
.cp .off { top: 8px; left: 8px; font-size: 11px; padding: 3px 7px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Início */
.hi { display: grid; grid-template-columns: 1fr 860px; padding: 24px 56px 0; height: 520px; }
.hi-copy { align-self: center; padding-right: 40px; }
.hi-copy h1 { font-size: 72px; margin: 16px 0 18px; }
.hi-copy p { font-size: 18px; color: var(--muted); margin-bottom: 30px; max-width: 400px; }
.hi-img { width: 860px; height: 496px; border-radius: 8px; object-fit: cover; object-position: 50% 35%; }
.nov { padding: 40px 56px 0; }
.hi-img2 { width: 390px; height: 380px; object-fit: cover; object-position: 28% 40%; }
.cp .hi-copy { padding: 22px 16px 0; }
.cp .hi-copy h1 { font-size: 40px; margin: 10px 0 12px; }
.cp .hi-copy p { font-size: 15px; margin-bottom: 20px; }
.cp .nov { padding: 32px 16px 0; }

/* Coleção */
.co-top { padding: 32px 56px 0; }
.co-top h1 { font-size: 56px; margin-top: 10px; display: flex; align-items: baseline; gap: 16px; }
.co-top h1 small { font-size: 16px; font-weight: 400; color: var(--muted); letter-spacing: 0; font-stretch: 100%; }
.co-bar { margin: 24px 56px 0; padding: 14px 0; border-block: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.chp { height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; white-space: nowrap; }
.chp.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dd { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.dd .i { width: 16px; height: 16px; }
.co-grid { padding: 28px 56px 0; row-gap: 32px; }
.cp .co-top { padding: 18px 16px 0; }
.cp .co-top h1 { font-size: 36px; margin-top: 6px; gap: 10px; }
.cp .co-top h1 small { font-size: 14px; }
.co-chips { display: flex; gap: 8px; padding: 16px 16px 12px; overflow: hidden; }
.co-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
.co-tools span { height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; font-size: 14px; }
.co-tools .i { width: 16px; height: 16px; }
.cp .co-grid { padding: 0 16px; row-gap: 20px; }

/* Produto */
.pr { display: grid; grid-template-columns: 88px 660px 1fr; gap: 40px; padding: 28px 56px 0; }
.thumbs { display: grid; gap: 12px; align-content: start; }
.thumbs .on { outline: 1.5px solid var(--ink); outline-offset: 3px; }
.pr-main { width: 660px; border-radius: 8px; }
.pr-info { padding-top: 8px; }
.pr-info h1 { font-size: 42px; margin: 10px 0 14px; }
.price { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.price b { font-size: 24px; font-weight: 600; }
.price s { font-size: 17px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--paper-2); }
.desc { font-size: 16px; color: var(--muted); line-height: 1.5; margin: 18px 0 26px !important; max-width: 520px; }
.size-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.size-h b { font-size: 15px; font-weight: 600; }
.size-h u { font-size: 14px; color: var(--muted); text-underline-offset: 3px; }
.sizes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.sizes span { height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.sizes .on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.buy { display: flex; gap: 12px; margin-top: 24px; }
.buy .btn { flex: 1; height: 56px; font-size: 17px; }
.sq { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.trust { display: grid; gap: 10px; margin-top: 26px; font-size: 14px; color: var(--muted); }
.trust span { display: flex; align-items: center; gap: 10px; }
.trust .i { width: 20px; height: 20px; color: var(--ink); }
.pr-media { position: relative; width: 390px; height: 390px; background: var(--paper-2); }
.pr-media img { width: 100%; height: 100%; object-fit: cover; }
.dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgb(var(--ink-rgb) / .25); }
.dots i.on { width: 18px; background: var(--ink); }
.pr-info.p { padding: 16px 16px 0; }
.pr-info.p h1 { font-size: 26px; margin: 6px 0 8px; }
.pr-info.p .price b { font-size: 20px; }
.pr-info.p .price s { font-size: 15px; }
.pr-info.p .size-h { margin-top: 18px; }
.pr-info.p .sizes { gap: 6px; }
.pr-info.p .sizes span { height: 44px; font-size: 15px; }
.pr-info.p .trust { margin-top: 16px; font-size: 13px; gap: 8px; }
.pr-info.p .trust .i { width: 18px; height: 18px; }
.sticky { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: var(--paper); border-top: 1px solid var(--line); }

/* Carrinho */
.ca { display: grid; grid-template-columns: 1fr 400px; gap: 56px; padding: 32px 56px 0; }
.ca-h { display: flex; align-items: baseline; gap: 14px; }
.ca-h h1 { font-size: 44px; }
.ca-h span { color: var(--muted); font-size: 16px; }
.ship { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
.ship b { font-weight: 600; }
.track { height: 6px; border-radius: 3px; background: var(--paper-2); margin-top: 12px; overflow: hidden; }
.track i { display: block; height: 100%; width: 50%; background: var(--ink); border-radius: 3px; }
.item { display: grid; grid-template-columns: 112px 1fr auto auto; gap: 22px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
.item h3 { font-size: 17px; font-weight: 600; }
.item .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.item .rm { color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 10px; display: block; }
.step { height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; gap: 14px; padding: 0 12px; font-weight: 600; font-size: 15px; }
.step .i { width: 16px; height: 16px; }
.item .amt { font-size: 17px; font-weight: 600; }
.up-h { margin: 26px 0 14px; }
.up-h h3 { font-size: 18px; font-weight: 600; }
.up-h p { color: var(--muted); font-size: 14px; margin-top: 4px; }
.ups { display: grid; grid-template-columns: repeat(3, 150px); gap: 18px; }
.add { margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--azul); }
.add .i { width: 15px; height: 15px; }
.sum { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 26px; align-self: start; margin-top: 8px; }
.sum h3 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
.ln { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.ln small { color: var(--muted); font-size: 13px; }
.ln.tot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; font-weight: 600; }
.ln.tot b { font-size: 24px; font-weight: 600; }
.pay { margin-top: 14px !important; text-align: center; color: var(--muted); font-size: 12px; }
.ca1 { padding: 18px 16px 0; }
.cp .ca-h h1 { font-size: 30px; }
.cp .ca-h span { font-size: 14px; }
.cp .ship { margin-top: 14px; padding: 14px; font-size: 14px; }
.cp .item { grid-template-columns: 88px 1fr auto; gap: 14px; padding: 16px 0; }
.cp .item h3 { font-size: 15px; }
.cp .item .meta { font-size: 13px; }
.cp .item .amt { font-size: 15px; }
.cp .step { height: 34px; margin-top: 10px; display: inline-flex; font-size: 14px; }
.cp .up-h { margin: 18px 0 12px; }
.cp .up-h h3 { font-size: 16px; }
.cp .up-h p { font-size: 13px; }
.cp .ups { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* Pesquisa */
.se-under { position: absolute; top: 120px; left: 0; right: 0; bottom: 0; }
.se-dim { position: absolute; inset: 120px 0 0 0; background: rgb(var(--ink-rgb) / .38); }
.se-panel { position: absolute; top: 120px; left: 0; right: 0; background: var(--paper); padding: 32px 56px 40px; box-shadow: 0 30px 60px -20px rgb(var(--shade) / .45); }
.q { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1.5px solid var(--ink); }
.q .i { width: 28px; height: 28px; }
.q b { font-size: 40px; font-weight: 500; letter-spacing: -.02em; line-height: 1; }
.q .caret { width: 2px; height: 40px; background: var(--ink); margin-left: -12px; }
.q .clr { margin-left: auto; font-size: 14px; color: var(--muted); text-decoration: underline; }
.se-body { display: grid; grid-template-columns: 240px 1fr; gap: 48px; margin-top: 28px; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px !important; }
.sugs { display: grid; gap: 12px; font-size: 18px; color: var(--muted); }
.sugs b { color: var(--ink); font-weight: 600; }
.se-top { display: flex; align-items: center; gap: 14px; padding: 24px 16px 12px; border-bottom: 1px solid var(--line); }
.fld { flex: 1; height: 44px; border-radius: 22px; border: 1.5px solid var(--ink); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 16px; }
.fld .i { width: 18px; height: 18px; }
.fld .caret { width: 1.5px; height: 20px; background: var(--ink); margin-left: -6px; }
.fld .x { margin-left: auto; color: var(--muted); line-height: 0; }
.se-top > span { font-size: 15px; font-weight: 500; }
.pop { padding: 16px 16px 4px; }
.pop .row { gap: 8px; flex-wrap: wrap; }
.se-res { padding: 18px 16px 0; }

/* Menu */
.me { position: absolute; inset: 0; background: var(--paper); }
.me-top { height: 76px; padding: 14px 16px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--line); }
.me-top .i { justify-self: end; }
.me-top .logo { width: 50px; height: 50px; }
.me-links { margin: 6px 16px 0; }
.me-links div { height: 62px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
.me-links .i { width: 20px; height: 20px; color: var(--muted); }
.me-links em { font-style: normal; font-size: 13px; font-weight: 600; letter-spacing: 0; padding: 3px 9px; border-radius: 999px; background: var(--paper-2); margin-left: 10px; vertical-align: middle; }
.me-sub { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 16px 0; }
.me-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 16px 0; }
.me-tiles img { width: 100%; height: 230px; object-fit: cover; border-radius: 8px; }
.me-tiles span { display: block; margin-top: 8px; font-weight: 600; font-size: 15px; }
.me-contact { position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.me-contact span { display: flex; align-items: center; gap: 8px; }
.me-contact .i { width: 18px; height: 18px; color: var(--ink); }

/* A loja */
.lo { position: relative; height: 560px; overflow: hidden; }
.lo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 30%; }
.lo-copy { position: absolute; left: 56px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; }
.lo-copy h1 { font-size: 54px; margin: 14px 0 18px; line-height: 1.02; }
.lo-copy p { font-size: 17px; color: var(--muted); max-width: 460px; line-height: 1.5; }
.lo-copy .sig { margin-top: 18px; font-weight: 600; color: var(--ink); }
.vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; padding: 36px 56px 0; }
.vals b { font-size: 18px; font-weight: 600; }
.vals p { color: var(--muted); font-size: 15px; margin-top: 6px !important; }
.cp .lo { height: 330px; }
.cp .lo > img { object-position: 84% 30%; }
.cp .lo-copy { position: static; width: auto; padding: 22px 16px 0; }
.cp .lo-copy h1 { font-size: 30px; margin: 10px 0 12px; }
.cp .lo-copy p { font-size: 15px; }
.cp .vals { grid-template-columns: 1fr; gap: 14px; padding: 26px 16px 0; margin-top: 4px; border-top: 1px solid var(--line); margin-inline: 16px; padding-inline: 0; }
.cp .vals b { font-size: 15px; }
.cp .vals p { font-size: 14px; margin-top: 2px !important; }

/* 404 */
.er { text-align: center; padding: 84px 56px 0; }
.er h1 { font-size: 64px; margin: 14px 0; }
.er p { font-size: 18px; color: var(--muted); }
.er .row { justify-content: center; margin-top: 28px; }
.er-more { padding: 56px 56px 0; }
.cp .er { padding: 56px 20px 0; }
.cp .er h1 { font-size: 36px; margin: 12px 0 10px; }
.cp .er p { font-size: 15px; }
.cp .er .row { flex-direction: column; align-items: stretch; gap: 16px; margin-top: 24px; }
.cp .er-more { padding: 40px 16px 0; }

@media (max-width: 860px) {
  .devices, .devices.solo { grid-template-columns: minmax(0, 1fr); }
}
</style>

  const tags = `<span class="tag t-before">Hoje</span><span class="tag t-after">Depois</span>`;
  const handle = `<div class="handle" role="slider" tabindex="0" aria-label="Comparar hoje e depois" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="knob"><svg class="i" width="22" height="22"><use href="#i-arrows"/></svg></span></div>`;
  const NAMES = { inicio: 'Início', colecao: 'Coleção', produto: 'Produto', carrinho: 'Carrinho', pesquisa: 'Pesquisa', menu: 'Menu', loja: 'A loja', erro: 'Página 404' };
  const compare = (id, dev) => {
    const d = dev === 'd';
    return `<div class="compare" data-compare aria-label="${NAMES[id]} no ${d ? 'computador' : 'telemóvel'}, hoje e depois">
      <div class="layer after"><div class="canvas ${d ? 'cd' : 'cp'}" style="width:${d ? 1440 : 390}px;height:${d ? 900 : 844}px"><div class="s">${M[`${id}-${dev}`]()}</div></div></div>
      <div class="layer before"><img src="assets/antes/${id}-${dev}.webp" alt="${NAMES[id]} hoje" loading="lazy"></div>${tags}${handle}</div>`;
  };
  document.querySelectorAll('[data-pair]').forEach((el) => {
    const id = el.dataset.pair;
    const desk = M[`${id}-d`] ? `<figure class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">meu-azul.com</span></div>${compare(id, 'd')}</figure>` : '';
    el.innerHTML = `${desk}<div class="phone">${compare(id, 'p')}</div>`;
  });

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-compare]').forEach((el) => {
    const canvas = el.querySelector('.canvas');
    const handle = el.querySelector('.handle');
    let pos = 50, demo = 0, start = null, dragging = false;
    const set = (v) => {
      pos = Math.max(0, Math.min(100, v));
      el.style.setProperty('--pos', pos + '%');
      handle.setAttribute('aria-valuenow', Math.round(pos));
      el.classList.toggle('lo', pos < 16);
      el.classList.toggle('hi', pos > 84);
    };
    const fromX = (x) => { const r = el.getBoundingClientRect(); set(((x - r.left) / r.width) * 100); };
    const stopDemo = () => { cancelAnimationFrame(demo); demo = -1; };
    if (canvas) new ResizeObserver(() => el.style.setProperty('--k', el.clientWidth / canvas.offsetWidth)).observe(el);
    el.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY, id: e.pointerId }; stopDemo(); });
    el.addEventListener('pointermove', (e) => {
      if (!start) return;
      if (!dragging) {
        const dx = Math.abs(e.clientX - start.x), dy = Math.abs(e.clientY - start.y);
        if (dx < 6 || dx < dy) return;
        dragging = true;
        try { el.setPointerCapture(start.id); } catch (_) {}
      }
      fromX(e.clientX);
    });
    const end = (e) => { if (start && !dragging && e.type === 'pointerup') fromX(e.clientX); start = null; dragging = false; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    handle.addEventListener('keydown', (e) => {
      const step = { ArrowLeft: -5, ArrowRight: 5, Home: -100, End: 100 }[e.key];
      if (step === undefined) return;
      e.preventDefault(); stopDemo(); set(pos + step);
    });
    if (still) return;
    // One back-and-forth the first time it scrolls into view, so people see it moves.
    const keys = [50, 26, 74, 50], seg = 520;
    const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const io = new IntersectionObserver((entries) => {
      if (!entries[0].isIntersecting || demo !== 0) return;
      io.disconnect();
      const t0 = performance.now() + 200;
      const run = (now) => {
        if (demo === -1) return;
        const t = Math.max(0, now - t0), i = Math.min(keys.length - 2, Math.floor(t / seg));
        set(keys[i] + (keys[i + 1] - keys[i]) * ease(Math.min(1, (t - i * seg) / seg)));
        if (t < seg * (keys.length - 1)) demo = requestAnimationFrame(run);
      };
      demo = requestAnimationFrame(run);
    }, { threshold: 0.6 });
    io.observe(el);
  });
})();
</script>
</body>
</html>
